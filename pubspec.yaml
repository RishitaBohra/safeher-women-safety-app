name: safeher
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.9.0
  firebase_auth: ^6.5.1
  cloud_firestore: ^6.4.1
  google_maps_flutter: ^2.14.2
  geolocator: ^14.0.2
  intl: ^0.19.0
  flutter_contacts: ^1.1.9+2
  url_launcher: ^6.3.0
  geocoding: ^3.0.0
  flutter_local_notifications: ^19.4.0
  timezone: ^0.10.0
  

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/